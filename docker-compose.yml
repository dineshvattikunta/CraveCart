services:
  # -------------------------------------------------------------
  # MongoDB Database Service
  # -------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: cravecart_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cravecart
    volumes:
      - mongo_data:/data/db
    networks:
      - cravecart_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------
  # Python Flask REST API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cravecart_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/cravecart
      - DB_NAME=cravecart
      - FLASK_ENV=production
      - CORS_ORIGINS=*
      - SECRET_KEY=cravecart-production-secret-replace-in-env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cravecart_net
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------
  # React Frontend (Nginx Multi-stage Production Build)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cravecart_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cravecart_net

volumes:
  mongo_data:
    driver: local

networks:
  cravecart_net:
    driver: bridge
